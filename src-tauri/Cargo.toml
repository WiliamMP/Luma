[package]
name = "luma"
version = "0.1.0"
description = "Chat with servers, channels, DMs and voice"
authors = ["Wiliam Patricio"]
edition = "2021"
license = "MIT"

[lib]
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
