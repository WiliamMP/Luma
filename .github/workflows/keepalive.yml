# Supabase pauses free projects after 7 days without database activity.
# Two small queries a week keep the project awake.
# Note: GitHub turns off scheduled workflows after 60 days without commits;
# re-enable it in the Actions tab if that happens.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 12 * * 1,4" # Monday and Thursday, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -sS --fail -m 30 -o /dev/null -w "%{http_code}\n"
          "$URL/rest/v1/profiles?select=id&limit=1"
          -H "apikey: $KEY"
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
