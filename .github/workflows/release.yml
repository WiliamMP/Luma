# Builds the Windows installer and publishes it as a GitHub Release when a
# version tag is pushed (git tag v0.2.0 && git push origin v0.2.0).
# `will install Luma` downloads the -setup.exe from the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # baked into the app by Vite at build time (the anon key is public by design)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Luma ${{ github.ref_name }}
          releaseBody: Instale pelo arquivo -setup.exe ou com `will install Luma`.
          releaseDraft: false
          prerelease: false
