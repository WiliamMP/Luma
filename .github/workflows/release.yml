# Builds the Windows installer and publishes it as a GitHub Release when a
# version tag is pushed (git tag v0.2.0 && git push origin v0.2.0).
# `will install Luma` downloads the -setup.exe from the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # new SQL goes in before the installer that depends on it is published
  migrate:
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  release:
    needs: migrate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # baked into the app by Vite at build time (the anon key is public by design)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # private key from `tauri signer generate` signs the installer for the auto-updater
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Luma ${{ github.ref_name }}
          releaseBody: Instale pelo arquivo -setup.exe ou com `will install Luma`. Quem já tem o Luma recebe esta versão pelo aviso de atualização.
          releaseDraft: false
          prerelease: false
          # latest.json points the updater at the NSIS setup
          updaterJsonPreferNsis: true

      # tell apps that are open right now (App.tsx UpdateBar listens on the "releases" broadcast topic)
      - name: Announce the release
        continue-on-error: true # the release is out either way; apps also check every 30 min
        shell: bash
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -sS --fail -X POST "$URL/realtime/v1/api/broadcast" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"topic\":\"releases\",\"event\":\"published\",\"payload\":{\"version\":\"${GITHUB_REF_NAME#v}\"}}]}"
